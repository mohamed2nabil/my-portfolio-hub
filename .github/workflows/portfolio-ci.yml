name: Portfolio Quality Gate

on:
  push:
    branches:
      - feature/premium-multi-portfolio
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium for real motion verification
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser-test animations in normal and reduced-motion mode
        run: |
          npm run start -- -p 3200 > /tmp/portfolio-app.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3200/ai-automation > /dev/null; then break; fi
            sleep 2
          done
          node scripts/verify-motion.mjs
